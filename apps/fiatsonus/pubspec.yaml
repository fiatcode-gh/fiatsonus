name: fiatsonus
description: Procedural ambient soundscapes for Android.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  audio_service: 0.18.19
  audio_session: 0.2.4
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  fiatsonus_engine: any
  flutter_soloud: 5.3.1
  path_provider: ^2.1.6
  path_provider_platform_interface: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  vm_service: ^15.4.0

flutter:
  uses-material-design: true
